<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Resume Analyzer 🚀</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
    body {
        margin: 0; padding: 0;
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #a1c4fd, #c2e9fb);
        height: 100vh;
        display: flex; justify-content: center; align-items: center;
        overflow: hidden;
    }
    /* abstract blobs */
    body::before, body::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        filter: blur(120px);
        z-index: -1;
    }
    body::before {
        width: 400px; height: 400px;
        background: rgba(255, 183, 197, 0.5);
        top: -100px; left: -100px;
    }
    body::after {
        width: 500px; height: 500px;
        background: rgba(0, 183, 255, 0.4);
        bottom: -150px; right: -150px;
    }
    .container {
        background-color: #ffffffcc;
        padding: 50px;
        border-radius: 25px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        text-align: center;
        width: 400px;
        transition: transform 0.3s;
    }
    .container:hover { transform: scale(1.03); }
    h1 {
        color: #1e90ff; font-size: 2.2em; margin-bottom: 20px;
    }
    input[type="file"], input[type="text"] {
        padding: 12px; border-radius: 12px;
        border: 1px solid #1e90ff; width: 80%; margin-bottom: 20px;
        transition: all 0.2s;
    }
    input[type="file"]:hover, input[type="text"]:hover { border-color: #0b60b7; }
    button {
        padding: 12px 25px;
        font-size: 1em;
        background: linear-gradient(45deg, #1e90ff, #00d4ff);
        color: white;
        border: none; border-radius: 12px;
        cursor: pointer;
        transition: all 0.3s;
    }
    button:hover { transform: scale(1.05); background: linear-gradient(45deg, #0b60b7, #00bfff);}
    .footer { margin-top: 15px; font-size: 0.9em; color: #555; }
</style>
</head>
<body>
<div class="container">
    <h1>AI Resume Analyzer 🤖</h1>
    <form method="post" enctype="multipart/form-data">
        <input type="file" name="resume" required><br>
        <input type="text" name="dream_role" placeholder="Enter your dream role (e.g., Data Scientist)"><br>
        <button type="submit">Analyze Resume</button>
    </form>
    <div class="footer">Upload any resume type: PDF, TXT, Word, or folders 📄</div>
</div>
</body>
</html>
